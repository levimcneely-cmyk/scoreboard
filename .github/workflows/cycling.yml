name: Update cycling results

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes; the script skips work when nothing is racing
  workflow_dispatch: {}         # adds a "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: cycling
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # selectolax must stay below 1.0: newer versions break the procyclingstats library
      - name: Install
        run: pip install "procyclingstats==0.2.8" "selectolax<1.0" cloudscraper

      - name: Fetch results
        run: python scripts/cycling.py

      - name: Save if changed
        run: |
          if [ -n "$(git status --porcelain cycling.json)" ]; then
            git config user.name "cycling-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cycling.json
            git commit -m "Update cycling results"
            git pull --rebase --autostash
            git push
          else
            echo "No changes"
          fi
