<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scoreboard">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7EBEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A22" media="(prefers-color-scheme: dark)">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EBEF; --card:#FFFFFF; --ink:#16212C; --muted:#5F6B78; --faint:#8C96A1;
  --line:#D6DCE3; --chip:#EEF1F4; --live:#D3202C; --win:#1D8048; --loss:#B8322A; --draw:#8A6D1E;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#131A22; --card:#1C252F; --ink:#EDF1F5; --muted:#A3AEBA; --faint:#77838F;
    --line:#2C3743; --chip:#26313C; --win:#46B478; --loss:#E0655C; --draw:#D1B45C; }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.35 var(--body);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
button{font:inherit;color:inherit}
a{color:inherit}

/* Masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 2px 12px}
.mast h1{margin:0;font:700 34px/0.95 var(--cond);letter-spacing:-0.01em}
.mast .sub{color:var(--muted);font-size:13px;margin-top:4px}
.refresh{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.refresh:disabled{opacity:.5}
.refresh:focus-visible,.tab:focus-visible,.card a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Up next strip */
.slate{background:var(--card);border-radius:16px;padding:6px 0;margin-bottom:14px}
.slate h2{font:600 15px/1 var(--body);color:var(--muted);margin:10px 14px 6px}
.srow{display:grid;grid-template-columns:78px 26px 1fr auto;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .when{font:600 15px/1.1 var(--cond)}
.srow .when small{display:block;font:500 13px/1.1 var(--cond);color:var(--muted)}
.srow .what{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .tv{font-size:12px;color:var(--muted);text-align:right}
.srow.fam .what::after{content:"family";margin-left:6px;font-size:11px;color:var(--faint)}
.slate .empty{padding:8px 14px 12px;color:var(--muted)}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:4px;
  background:var(--bg);padding:6px 0 10px}
.tabs-inner{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--chip);border-radius:11px;padding:3px;grid-column:1/-1}
.tab{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Cards */
.list{display:grid;gap:10px}
.card{position:relative;background:var(--card);border-radius:14px;padding:12px 14px 12px 18px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc,#888)}
.card.off{opacity:.55;filter:grayscale(1)}
.card.off.pre::after{content:"Preseason"}
.card.off::after{content:"Offseason";position:absolute;right:12px;top:12px;font-size:11px;font-weight:600;color:var(--muted);
  background:var(--chip);padding:2px 7px;border-radius:6px}
.head{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}
.logo{width:38px;height:38px;object-fit:contain}
.mono{width:38px;height:38px;border-radius:9px;background:var(--tc);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--cond);letter-spacing:0;overflow:hidden}
.name{font:700 21px/1 var(--cond)}
.name a{text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12px;color:var(--muted);background:var(--chip);border-radius:6px;padding:1px 6px}
.chip.rank{color:var(--ink);font-weight:600}
.big{font:700 26px/1 var(--cond);text-align:right;white-space:nowrap}
.big small{display:block;font:500 12px/1.2 var(--body);color:var(--muted)}
.card.off .big{display:none}
.rows{margin-top:10px;display:grid;gap:0}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.k{font-size:12px;color:var(--faint);font-weight:600}
.v{font-weight:500;min-width:0}
.v .note{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.d{text-align:right;font:500 15px/1.15 var(--cond);white-space:nowrap}
.d small{display:block;font:500 12px/1.2 var(--body);color:var(--muted)}
.res{display:inline-block;min-width:18px;text-align:center;font:700 14px/18px var(--cond);color:#fff;border-radius:4px;margin-right:6px}
.res.W{background:var(--win)} .res.L{background:var(--loss)} .res.D,.res.T{background:var(--draw)}
.form{display:flex;gap:3px;margin-top:8px;align-items:center}
.form span{width:8px;height:8px;border-radius:2px}
.form .W{background:var(--win)} .form .L{background:var(--loss)} .form .D,.form .T{background:var(--draw)}
.form em{font-style:normal;font-size:11px;color:var(--faint);margin-right:4px}
.live{color:var(--live);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:5px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.lb{margin:4px 0 0;padding:0;list-style:none;counter-reset:lb;font-weight:400;font-size:14px}
.lb li{counter-increment:lb;display:grid;grid-template-columns:22px 1fr auto;gap:6px;padding:1px 0}
.lb li::before{content:counter(lb);color:var(--faint);font:600 14px/1.35 var(--cond)}
.lb li b{font:600 15px/1.3 var(--cond)}
.tab .cnt[hidden]{display:none}
.tab .cnt{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--live);color:#fff;font:700 12px/18px var(--body)}
/* Live now tab */
.lv .lvtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.lv .lvtop .live{font-size:13px}
.lv .lvtop .soon{font-weight:700;color:var(--ink)}
.lv .who{font-size:11px;color:var(--faint);font-weight:600}
.sbx{margin-top:8px;display:grid;gap:4px}
.sbx .t{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center}
.sbx .t img{width:32px;height:32px;object-fit:contain}
.sbx .tn{font:600 20px/1 var(--cond)}
.sbx .tn small{font:500 12px/1 var(--body);color:var(--muted);margin-left:6px}
.sbx .sc{font:700 32px/1 var(--cond);min-width:40px;text-align:right}
.sbx .t.mine .tn{font-weight:700}
.sbx .t.trail .sc,.sbx .t.trail .tn{color:var(--muted)}
.ls{margin-top:10px;overflow-x:auto}
.ls table{border-collapse:collapse;font:500 14px/1 var(--cond);min-width:100%}
.ls th,.ls td{padding:4px 5px;text-align:center;white-space:nowrap}
.ls th{color:var(--faint);font-weight:600}
.ls td:first-child,.ls th:first-child{text-align:left;padding-left:0}
.ls .tot{font-weight:700;border-left:1px solid var(--line)}
.sit{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.sit .count{font:600 16px/1.2 var(--cond)}
.sit .outs span{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);margin-right:3px}
.sit .outs span.on{background:var(--ink);border-color:var(--ink)}
.sit .muted{color:var(--muted);font-size:13px}
.lastplay{margin-top:8px;font-size:13px;color:var(--muted)}
.goals{margin-top:8px;font-size:14px;display:grid;gap:2px}
.goals b{font:600 14px/1.3 var(--cond);color:var(--muted);display:inline-block;min-width:34px}
.stx{margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}
.stx .r{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:4px 0;font-size:14px}
.stx .r span:first-child{text-align:left;font:600 15px/1.2 var(--cond)}
.stx .r span:last-child{text-align:right;font:600 15px/1.2 var(--cond)}
.stx .r em{font-style:normal;color:var(--muted);font-size:12px;text-align:center}
.lvlink{display:inline-block;margin-top:10px;font-size:13px;font-weight:600}
.nolive{background:var(--card);border-radius:14px;padding:18px 16px;color:var(--muted)}
.nolive b{display:block;color:var(--ink);font:700 20px/1.1 var(--cond);margin-bottom:4px}
.err{color:var(--muted);font-size:13px;margin-top:8px}
/* Tap-to-open detail */
.more{margin-top:10px;border-top:1px solid var(--line)}
.more summary{list-style:none;cursor:pointer;padding:9px 0 2px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.more[open] summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
@media (prefers-reduced-motion: reduce){.more summary::after{transition:none}}
.more summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.msec{margin-top:8px}
.mtitle{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:4px}
.mt{width:100%;border-collapse:collapse;font-size:14px}
.mt th{font-size:11px;font-weight:600;color:var(--faint);text-align:right;padding:2px 4px}
.mt td{padding:4px;text-align:right;border-top:1px solid var(--line);font:500 15px/1.2 var(--cond)}
.mt th:nth-child(-n+2),.mt td:nth-child(-n+2){text-align:left}
.mt td:first-child{width:22px;color:var(--faint)}
.mt td:nth-child(2){font:500 14px/1.25 var(--body)}
.mt tr.me td{font-weight:700;color:var(--ink)}
.mt tr.me td:nth-child(2){font-weight:700}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-weight:500}
.mrow .d{text-align:right;font:500 15px/1.15 var(--cond);white-space:nowrap}
.mrow .d small{display:block;font:500 12px/1.2 var(--body);color:var(--muted)}
.skel{height:120px;background:var(--card);border-radius:14px;opacity:.6}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <h1 id="today">Scoreboard</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <button class="refresh" id="refresh" type="button">Refresh</button>
  </header>

  <section class="slate" id="slate" aria-label="Coming up this week">
    <h2>Coming up this week</h2>
    <div class="empty">Loading…</div>
  </section>

  <nav class="tabs" role="tablist">
    <div class="tabs-inner">
      <button class="tab" role="tab" data-tab="mine" aria-selected="true">My teams</button>
      <button class="tab" role="tab" data-tab="family" aria-selected="false">Family</button>
      <button class="tab" role="tab" data-tab="live" aria-selected="false">Live now<span class="cnt" id="livecnt" hidden></span></button>
    </div>
  </nav>

  <main class="list" id="list"></main>
  <p class="foot">Scores from ESPN and Jolpica F1. Times shown in your local time zone.</p>
</div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
